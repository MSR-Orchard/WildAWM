[project]
name = "wildawm-cli"
version = "0.1.0"
description = "Unified wildawm CLI over the WildAWM synthesis and evaluation components"
requires-python = ">=3.12"
dependencies = [
    "awm-in-the-wild",
    "awmeval",
    "simpleargparser>=0.2.4",
]

[project.scripts]
wildawm = "wildawm_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wildawm_cli"]

[tool.uv.sources]
awm-in-the-wild = { workspace = true }
awmeval = { workspace = true }
